name: random_pick
description: "랜덤픽 - 룰렛, 사다리타기, 팀나누기를 한 번에. PLAY YOUR NEXT WORLD."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_mobile_ads: ^9.1.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/images/
    - assets/images/branding/
    - assets/images/roulette/
    - assets/images/ladder/
    - assets/images/team/team_header.png
    - assets/images/team/team_result_mascot.png
    - assets/images/team/team_reveal_sparkle.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/branding/app_icon.png"
  adaptive_icon_background: "#F7F5FC"
  adaptive_icon_foreground: "assets/images/branding/app_icon_adaptive.png"
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true

flutter_native_splash:
  android: true
  ios: false
  web: false
  color: "#F7F5FC"
  image: assets/images/branding/app_icon_adaptive.png
  android_12:
    color: "#F7F5FC"
    image: assets/images/branding/app_icon_adaptive.png
